name: release

# Push a tag like v0.2.0 to build the wheel and attach it to a GitHub release. Nothing is published to PyPI.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv venv --python 3.12 && uv pip install -e ".[dev]"
      - run: .venv/bin/pytest -q
      - name: the tag must match the package version
        run: test "v$(.venv/bin/python -c 'import exception_guardian as e; print(e.__version__)')" = "$GITHUB_REF_NAME"
      - run: uv build
      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
