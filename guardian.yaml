# Exception Guardian configuration (sample mode: every source reads fixtures in samples/).
sources:
  - name: tenable-vm
    fixture_dir: samples/tenable_vm
  - name: tenable-sc
    fixture_dir: samples/tenable_sc
  - name: csv
    path: samples/csv/other_scanner_exceptions.csv
    map: maps/other-scanner.yaml
assets:
  fixture: samples/tenable_vm/assets.json

# Grading thresholds
revoke_epss: 0.5
review_max_age_days: 365
review_epss_delta: 0.1
internal_keywords: [internal, not internet, no external, isolated, air-gapped, intranet]

siem_targets: [splunk, sentinel, defender]
# Your own values for SigmaHQ placeholders. Unset, a placeholder matches any value, and one in a filter ("not from
# your DC addresses") gets the stand-in SET_<name>: the query runs but excludes nothing, so it is noisy. Values may
# also sit in a git-ignored file with the same map (placeholders_file: placeholders.local.yaml), which wins.
# placeholders:
#   DC-MACHINE-NAME: [DC01$, DC02$]
#   dc_machine_accounts: [DC01$, DC02$]
#   dc_ip_addresses: [10.0.0.10, 10.0.0.11]
offline: false
intel_snapshot_dir: samples/intel
sample_logs_dir: samples/logs

# What faces the internet (INTERNET_FACING, REVOKE). Use your own tag names, ranges and an exported host list.
exposure:
  internet_tags: ["Exposure:Internet"]
  # internet_ranges: [198.51.100.0/24]
  # internet_hosts_file: exposure/internet-hosts.csv   # columns: host, source
